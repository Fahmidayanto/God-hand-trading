<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview 1 — ATR Band Sederhana</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .title { font-size: 15px; font-weight: 700; }
  .badge {
    background: rgba(34,211,238,.15);
    color: #22d3ee;
    border: 1px solid rgba(34,211,238,.3);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .chart {
    position: relative;
    height: 260px;
    background: #0b1220;
    border: 1px solid #1e293b;
    border-radius: 10px;
    overflow: hidden;
  }
  .candle {
    position: absolute;
    bottom: 40px;
    width: 10px;
    border-radius: 2px;
  }
  .wick {
    position: absolute;
    width: 2px;
    background: #64748b;
    left: 50%;
    transform: translateX(-50%);
  }
  .up { background: #22c55e; }
  .down { background: #ef4444; }
  .atr-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: #22d3ee;
    box-shadow: 0 0 8px rgba(34,211,238,.6);
  }
  .atr-label {
    position: absolute;
    background: #0e7490;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    font-family: monospace;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid #22d3ee;
    white-space: nowrap;
  }
  .legend {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    font-size: 12px;
    color: #94a3b8;
  }
  .legend span b { color: #22d3ee; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">ATR Band — Preview 1 (Sederhana)</div>
      <span class="badge">ATR ON</span>
    </div>

    <div class="chart" id="chart"></div>

    <div class="legend">
      <span>Garis horizontal: rentang candle 1–14</span>
      <span>Nilai ATR: <b>$40.00</b></span>
    </div>
  </div>

<script>
  const chart = document.getElementById('chart');
  const W = 720, H = 260;
  const base = 150; // baseline harga di tengah chart
  const n = 14;

  // Generate 14 candle (naik-turun acak)
  const candles = [];
  let price = base;
  for (let i = 0; i < n; i++) {
    const up = Math.random() > 0.5;
    const body = 8 + Math.random() * 22;
    const wick = 4 + Math.random() * 10;
    const open = up ? price : price + body;
    const close = up ? price + body : price;
    candles.push({ open, close, high: Math.max(open, close) + wick, low: Math.min(open, close) - wick, up });
    price = close;
  }

  // Hitung ATR sederhana (rata-rata true range)
  let trSum = 0;
  for (let i = 1; i < n; i++) {
    const c = candles[i], p = candles[i-1];
    const tr = Math.max(c.high - c.low, Math.abs(c.high - p.close), Math.abs(c.low - p.close));
    trSum += tr;
  }
  const atr = trSum / (n - 1);

  // Posisi candle
  const stepX = W / (n + 1);
  const scaleY = 1.2;
  const minP = Math.min(...candles.map(c => c.low));
  const maxP = Math.max(...candles.map(c => c.high));
  const range = (maxP - minP) || 1;
  const toY = (p) => H - 50 - ((p - minP) / range) * (H - 100);

  candles.forEach((c, i) => {
    const x = stepX * (i + 1);
    const yOpen = toY(c.open), yClose = toY(c.close);
    const yHigh = toY(c.high), yLow = toY(c.low);
    const yTop = Math.min(yOpen, yClose);
    const h = Math.max(2, Math.abs(yClose - yOpen));

    // Wick
    const wick = document.createElement('div');
    wick.className = 'wick';
    wick.style.left = x + 'px';
    wick.style.top = yHigh + 'px';
    wick.style.height = (yLow - yHigh) + 'px';
    chart.appendChild(wick);

    // Body
    const body = document.createElement('div');
    body.className = 'candle ' + (c.up ? 'up' : 'down');
    body.style.left = (x - 5) + 'px';
    body.style.top = yTop + 'px';
    body.style.height = h + 'px';
    chart.appendChild(body);
  });

  // Garis ATR horizontal (di atas candle, dari candle 1 ke 14)
  const atrY = toY(maxP) - 30;
  const line = document.createElement('div');
  line.className = 'atr-line';
  line.style.top = atrY + 'px';
  chart.appendChild(line);

  // Label nilai ATR di atas garis
  const label = document.createElement('div');
  label.className = 'atr-label';
  label.textContent = 'ATR $' + atr.toFixed(2);
  label.style.top = (atrY - 26) + 'px';
  label.style.left = (stepX * 1) + 'px';
  chart.appendChild(label);
</script>
</body>
</html>
